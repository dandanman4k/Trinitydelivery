<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <a href="/Stock">Stock</a>
    <a href="/Order" class="active">Orders</a>
  </div>

<!-- Content -->
  <div class="content">
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search items...">
    </div>

    <ul id="itemList"></ul>
  </div>

  <!-- Edit Modal -->
<div id="editModal" class="modal" style="display:none;">
  <div class="modal-content">
    <h2>Edit Order</h2>
    <input type="text" id="editCustomerName" placeholder="Customer name">
    <input type="text" id="editDrug" placeholder="Drug name">
    <input type="number" id="editAmount" placeholder="Amount">
    <input type="text" id="editLocation" placeholder="Location">
    <input type="number" id="editPhone" placeholder="Phone number">
    <button id="saveEditBtn">💾 Save</button>
    <button id="cancelEditBtn">❌ Cancel</button>
  </div>
</div>

  <script src="/scriptorders.js"></script>
</body>
</html>
